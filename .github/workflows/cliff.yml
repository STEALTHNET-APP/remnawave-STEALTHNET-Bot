name: git-cliff

on:
  push:
    branches:
      - main
      - lts

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch the full commit and tag history.

      - name: Prepare Release Context
        id: release
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess

          branch = os.environ["BRANCH_NAME"]
          suffix = "" if branch == "main" else f"-{branch}"
          exact_tag_pattern = r"^v[0-9]+\.[0-9]+\.[0-9]+$" if branch == "main" else rf"^v[0-9]+\.[0-9]+\.[0-9]+{re.escape(suffix)}$"
          fallback_tag_pattern = r"^v[0-9]+\.[0-9]+\.[0-9]+$"

          tags = subprocess.check_output(["git", "tag", "--merged", "HEAD", "--list"], text=True).splitlines()
          matched_tags = [tag for tag in tags if re.fullmatch(exact_tag_pattern, tag)]
          if not matched_tags and branch != "main":
              matched_tags = [tag for tag in tags if re.fullmatch(fallback_tag_pattern, tag)]

          def version_key(tag):
              base = tag[1:]
              if suffix and base.endswith(suffix):
                  base = base[: -len(suffix)]
              return tuple(map(int, base.split(".")))

          previous_tag = max(matched_tags, key=version_key) if matched_tags else ""
          previous_version = version_key(previous_tag) if previous_tag else (0, 1, 0)
          log_range = f"{previous_tag}..HEAD" if previous_tag else "HEAD"
          messages = subprocess.check_output(["git", "log", "--format=%B", log_range], text=True)

          major, minor, patch = previous_version
          if not previous_tag:
              next_version = previous_version
          elif re.search(r"(^|\n)(BREAKING CHANGE:|[A-Za-z]+(\([^)]+\))?!:)", messages):
              next_version = (major + 1, 0, 0)
          elif re.search(r"(^|\n)feat(\([^)]+\))?:", messages):
              next_version = (major, minor + 1, 0)
          else:
              next_version = (major, minor, patch + 1)

          version = "v" + ".".join(map(str, next_version)) + suffix
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag_pattern={exact_tag_pattern}\n")
          PY

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --unreleased --tag ${{ steps.release.outputs.version }} --tag-pattern ${{ steps.release.outputs.tag_pattern }} --use-branch-tags
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update the existing draft release or create a single new draft via GitHub CLI.
      - name: Create or Update Single Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.release.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
          CHANGELOG_TEXT: ${{ steps.git-cliff.outputs.content }}
        run: |
          # Save the generated changelog to a temporary notes file.
          printf '%s' "$CHANGELOG_TEXT" > notes.md

          # Convert direct commit links to PR references when GitHub can map the commit to a PR.
          # Also remove standalone merge commits so the release notes do not duplicate PR entries.
          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          notes = Path("notes.md")
          text = notes.read_text()
          cache = {}

          def pr_number(sha):
              # Cache GitHub API lookups because the same commit may appear more than once.
              if sha not in cache:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{sha}/pulls", "--jq", ".[0].number // empty"],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  cache[sha] = result.stdout.strip() if result.returncode == 0 else ""
              return cache[sha]

          def login_for_commit(sha):
              # Resolve the GitHub login for a commit author so release notes can link the nickname.
              cache_key = f"login:{sha}"
              if cache_key not in cache:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/commits/{sha}", "--jq", ".author.login // .committer.login // empty"],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  cache[cache_key] = result.stdout.strip() if result.returncode == 0 else ""
              return cache[cache_key]

          def replace_commit_author(match):
              # Add a plain GitHub mention when git-cliff did not emit one.
              login = login_for_commit(match.group("sha"))
              if not login:
                  return match.group(0)
              mention = match.group("linked_mention") or match.group("plain_mention") or login
              return f"{match.group('prefix')} @{mention.lstrip('@')}"

          def replace_commit_link(match):
              # Replace a commit link with (#PR) only when GitHub returns an associated PR.
              number = pr_number(match.group("sha"))
              return f"(#{number})" if number else match.group(0)

                                        # Add commit authors before the commit hash link is rewritten to a PR reference.
          text = re.sub(
              r"(?P<prefix>\(\[`(?P<short>[0-9a-f]{7})`\]\(https://github\.com/[^/]+/[^/]+/commit/(?P<sha>[0-9a-f]{40})\)\))(?: (?:\[@(?P<linked_mention>[^\]]+)\]\(https://github\.com/[^)]+\)|(?P<plain_mention>@[^\s]+)))?",
              replace_commit_author,
              text,
          )

          # Replace git-cliff commit links with PR references for commits associated with PRs.
          text = re.sub(
              r"\(\[`(?P<short>[0-9a-f]{7})`\]\(https://github\.com/[^/]+/[^/]+/commit/(?P<sha>[0-9a-f]{40})\)\)",
              replace_commit_link,
              text,
          )

          # Remove empty changelog sections left after filtering merge commits.
          text = re.sub(r"(?ms)^## [^\n]+\n(?:\s*\n)*(?=(?:## |---|\Z))", "", text)

          # Normalize release-note spacing around sections and the changelog footer.
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          rebuilt = []
          for line in lines:
              if line.startswith("## "):
                  if rebuilt:
                      rebuilt.append("")
                  rebuilt.extend([line, ""])
              elif line == "---":
                  if rebuilt and rebuilt[-1] != "":
                      rebuilt.append("")
                  rebuilt.extend([line, ""])
              elif line.startswith("**Full Changelog**"):
                  rebuilt.append(line)
              else:
                  rebuilt.append(line)

          text = "\n".join(rebuilt).strip()
          text = re.sub(r"\n{3,}", "\n\n", text)
          notes.write_text(text + "\n")
          PY

          # Find the tag name of the currently open draft release for this branch.
          DRAFT_TAG=""
          while IFS= read -r tag; do
            case "$BRANCH_NAME" in
              main)
                if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  DRAFT_TAG="$tag"
                  break
                fi
                ;;
              *)
                if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-${BRANCH_NAME}$ ]]; then
                  DRAFT_TAG="$tag"
                  break
                fi
                ;;
            esac
          done < <(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft == true) | .tag_name')


          if [ -n "$DRAFT_TAG" ]; then
            echo "Updating existing draft ($DRAFT_TAG) -> rewriting/renaming to $NEW_TAG..."
            gh release edit "$DRAFT_TAG" --tag "$NEW_TAG" --title "$NEW_TAG" --notes-file notes.md
          else
            echo "No draft releases found. Creating a new draft for version $NEW_TAG..."
            gh release create "$NEW_TAG" --draft --title "$NEW_TAG" --notes-file notes.md
          fi